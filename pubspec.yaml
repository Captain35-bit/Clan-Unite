name: clan_unite
description: A comprehensive social and financial management app for families and organizations.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  
  # State Management
  provider: ^6.1.0
  
  # Location
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0
  
  # Notifications
  firebase_messaging: ^14.7.0
  
  # UI/UX
  google_fonts: ^6.1.0
  intl: ^0.19.0
  
  # Networking & API
  http: ^1.1.0
  dio: ^5.3.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  
  # Image Handling
  image_picker: ^1.0.4
  cached_network_image: ^3.3.1
  
  # Utilities
  uuid: ^4.0.0
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
